name: Build Real iOS App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build iOS app (без подписи)
        run: |
          echo "Начинаем сборку iOS приложения..."
          xcodebuild -version
          
          # Так как у нас нет файла .xcodeproj, мы используем swiftc 
          # для компиляции простого бинарника под iOS
          xcrun --sdk iphoneos swiftc -parse-as-library -emit-executable -o HelloApp main.swift
          
          echo "Сборка завершена!"
          
      - name: Сохраняем результат
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstiOSApp
          path: HelloApp
