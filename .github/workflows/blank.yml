name: Build iOS App (Working)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Download a basic iOS project template
        run: |
          # Скачиваем проверенный тестовый проект
          git clone https://github.com/ioscreator/ioscreator.git my_project
          cd my_project

      - name: Build the iOS app
        run: |
          cd my_project
          # Собираем конкретный проект, который есть в этом репозитории
          xcodebuild -project HelloWorld/HelloWorld.xcodeproj -scheme HelloWorld -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO
          
      - name: Show build result
        run: |
          echo "Сборка завершена! Ищем файл приложения..."
          find . -name "*.app" -type d
