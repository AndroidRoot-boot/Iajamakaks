name: Build iOS App from Template

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Download a basic iOS project template
        run: |
          # Скачиваем готовый Xcode проект с сайта Apple (или другого надежного источника)
          # Здесь мы используем простейший проект Hello World
          git clone https://github.com/ricobeck/Kitura-Swift-Server.git test_project
          cd test_project

      - name: Build the iOS app
        run: |
          # Запускаем компиляцию Xcode
          cd test_project
          # Указываем, что собираем для симулятора или устройства
          xcodebuild -scheme HelloWorld -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          
      - name: Show build result
        run: |
          echo "Сборка завершена! Ищем файл приложения..."
          find test_project/build -name "*.app" -type d
